<title>OKLCH Knob</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: single column; a round dial (hue ring in the middle, chroma arc on the left, lightness arc on the right),
     with a readout row underneath. Page colors are overwritten live by the dial. */
  :root {
    --bg: #f6f6f8;
    --fg: #1c1d24;
    --muted: #6a6c7a;
    --line: #dcdde4;
    --surface: #ffffff;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #15161b; --fg: #ececf1; --muted: #9a9cab; --line: #2c2e38; --surface: #1d1e25; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #15161b; --fg: #ececf1; --muted: #9a9cab; --line: #2c2e38; --surface: #1d1e25; color-scheme: dark; }

  body {
    background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 48px 56px;
  }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  header h1 { font-size: 1.9rem; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); max-width: 62ch; }

  .panel {
    display: flex; flex-direction: column; gap: 18px; padding: 20px; min-width: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  }
  #dial { display: block; width: 100%; max-width: 440px; aspect-ratio: 1; margin: 0 auto; touch-action: none; cursor: pointer; }

  .values { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: baseline; }
  .values div { display: flex; flex-direction: column; gap: 2px; }
  .values .mid { align-items: center; }
  .values .right { align-items: flex-end; }
  .values span { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .values output { font-family: var(--mono); font-size: 0.95rem; font-variant-numeric: tabular-nums; }

  .readout { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-family: var(--mono); border-top: 1px solid var(--line); padding-top: 12px; }
  .readout .hex { font-size: 1rem; color: var(--fg); user-select: all; }
  .readout .alt { font-size: 0.8rem; color: var(--muted); user-select: all; }
  .gamut { font-family: var(--sans); font-size: 0.8rem; color: var(--muted); }

  /* Keyboard path: real range inputs, visually hidden; the dial draws a focus ring for whichever is focused */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; margin: 0; }
</style>

<main>
  <header>
    <h1>OKLCH Knob</h1>
    <p>Drag the ring to set hue. The left arc sets chroma and the right arc sets lightness, both increasing from bottom to top. Chroma uses an exponential scale for finer control at low values. With a keyboard, Tab to a control and use the arrow keys.</p>
  </header>

  <section class="panel" aria-label="OKLCH dial">
    <canvas id="dial" aria-hidden="true"></canvas>
    <label class="sr" for="o-hue">Hue<input type="range" id="o-hue" min="0" max="360" step="1"></label>
    <label class="sr" for="o-chroma">Chroma<input type="range" id="o-chroma" min="0" max="1000" step="1"></label>
    <label class="sr" for="o-light">Lightness<input type="range" id="o-light" min="0" max="100" step="0.1"></label>

    <div class="values">
      <div><span>Chroma</span><output id="o-chroma-v"></output></div>
      <div class="mid"><span>Hue</span><output id="o-hue-v"></output></div>
      <div class="right"><span>Lightness</span><output id="o-light-v"></output></div>
    </div>
    <div class="readout">
      <span class="hex" id="o-hex"></span>
      <span class="alt" id="o-alt"></span>
      <span class="gamut" id="o-gamut" hidden></span>
    </div>
  </section>
</main>

<script>
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };
  const $ = id => document.getElementById(id);
  const root = document.documentElement;

  // ---- Color math (sRGB channels are 0..1) ----
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const toHex = rgb => "#" + rgb.map(v => Math.round(clamp(v, 0, 1) * 255).toString(16).padStart(2, "0")).join("");
  const toGamma = v => v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
  // OKLCH (L 0..1) -> linear sRGB, may fall outside 0..1
  function oklchToLinear(L, C, H) {
    const hr = H * Math.PI / 180, a = C * Math.cos(hr), b = C * Math.sin(hr);
    const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
    const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
    const s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
    return [
       4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
    ];
  }
  const inGamut = rgb => rgb.every(v => v >= -1e-5 && v <= 1 + 1e-5);
  // Gamut-maps by lowering chroma (keeping lightness and hue) until the color fits sRGB
  function oklchToRgb(L, C, H) {
    let c = C;
    if (!inGamut(oklchToLinear(L, C, H))) {
      let lo = 0, hi = C;
      for (let i = 0; i < 24; i++) { const mid = (lo + hi) / 2; if (inGamut(oklchToLinear(L, mid, H))) lo = mid; else hi = mid; }
      c = lo;
    }
    return { rgb: oklchToLinear(L, c, H).map(v => toGamma(clamp(v, 0, 1))), c, clipped: c < C - 1e-4 };
  }
  const hexOf = (L, C, H) => toHex(oklchToRgb(L, C, H).rgb);

  // ---- Exponential chroma scale: position 0..1000, finer steps near 0 ----
  const C_MAX = 0.37;                                                      // covers every sRGB color
  const posToChroma = p => C_MAX * (Math.pow(101, p / 1000) - 1) / 100;
  const chromaToPos = c => Math.round(1000 * Math.log(clamp(c, 0, C_MAX) / C_MAX * 100 + 1) / Math.log(101));

  // ---- Dial geometry ----
  // Angles are compass degrees: 0 = top, increasing clockwise. Radii are fractions of the dial's half-width.
  const DISC = 0.40, HUE_IN = 0.44, HUE_OUT = 0.64, ARC_IN = 0.72, ARC_OUT = 0.92, KNOB = 0.07;
  const L_START = 170, C_START = 190, SPAN = 160;   // lightness: 170° (bottom) -> 10° (top); chroma: 190° -> 350°
  const lightAngle = t => L_START - SPAN * t;
  const chromaAngle = t => C_START + SPAN * t;

  const ok = { h: $("o-hue"), c: $("o-chroma"), l: $("o-light") };
  const canvas = $("dial"), ctx = canvas.getContext("2d");
  let size = 0, dpr = 1, theme = { fg: "#1c1d24", line: "#dcdde4", dark: false };
  const fontFamily = getComputedStyle(document.body).fontFamily;

  const rad = deg => (deg - 90) * Math.PI / 180;
  function bandPath(r0, r1, a0, a1) {
    const c = size / 2, R = size / 2;
    ctx.beginPath();
    ctx.arc(c, c, r1 * R, rad(a0), rad(a1));
    ctx.arc(c, c, r0 * R, rad(a1), rad(a0), true);
    ctx.closePath();
  }
  function handle(angle, r, color) {
    const c = size / 2, R = size / 2, a = rad(angle);
    const x = c + Math.cos(a) * r * R, y = c + Math.sin(a) * r * R;
    ctx.beginPath(); ctx.arc(x, y, KNOB * R, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#ffffff"; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, KNOB * R + 2, 0, Math.PI * 2);
    ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(0,0,0,0.55)"; ctx.stroke();
  }
  function focusRing(r0, r1, a0, a1, input) {
    if (!input.matches(":focus-visible")) return;
    bandPath(r0 - 0.02, r1 + 0.02, a0 - 1.5, a1 + 1.5);
    ctx.lineWidth = 2; ctx.strokeStyle = theme.fg; ctx.stroke();
  }

  function draw() {
    if (!size) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    const H = +ok.h.value, P = +ok.c.value, C = posToChroma(P), L = +ok.l.value / 100;
    const c = size / 2, R = size / 2;

    // Hue ring at current chroma and lightness
    for (let h = 0; h < 360; h += 2) { bandPath(HUE_IN, HUE_OUT, h, h + 2.6); ctx.fillStyle = hexOf(L, C, h + 1); ctx.fill(); }
    bandPath(HUE_IN, HUE_OUT, 0, 360); ctx.lineWidth = 1; ctx.strokeStyle = theme.line; ctx.stroke();

    // Chroma arc (left) and lightness arc (right), each in 80 slices
    const N = 80;
    for (let k = 0; k < N; k++) {
      const t0 = k / N, t1 = (k + 1) / N, tm = (k + 0.5) / N;
      bandPath(ARC_IN, ARC_OUT, chromaAngle(t0), chromaAngle(t1) + (k < N - 1 ? 0.6 : 0));
      ctx.fillStyle = hexOf(L, posToChroma(tm * 1000), H); ctx.fill();
      bandPath(ARC_IN, ARC_OUT, lightAngle(t1) - (k < N - 1 ? 0.6 : 0), lightAngle(t0));
      ctx.fillStyle = hexOf(tm, C, H); ctx.fill();
    }
    ctx.lineWidth = 1; ctx.strokeStyle = theme.line;
    bandPath(ARC_IN, ARC_OUT, C_START, C_START + SPAN); ctx.stroke();
    bandPath(ARC_IN, ARC_OUT, L_START - SPAN, L_START); ctx.stroke();

    focusRing(HUE_IN, HUE_OUT, 0, 360, ok.h);
    focusRing(ARC_IN, ARC_OUT, C_START, C_START + SPAN, ok.c);
    focusRing(ARC_IN, ARC_OUT, L_START - SPAN, L_START, ok.l);

    // Center disc shows the current color
    const hex = hexOf(L, C, H);
    ctx.beginPath(); ctx.arc(c, c, DISC * R, 0, Math.PI * 2);
    ctx.fillStyle = hex; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = theme.line; ctx.stroke();
    ctx.fillStyle = L < 0.6 ? "#ececf1" : "#1c1d24";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `600 ${Math.round(0.1 * R)}px ${fontFamily}`;
    ctx.fillText(hex, c, c - 0.05 * R);
    ctx.font = `400 ${Math.round(0.075 * R)}px ${fontFamily}`;
    ctx.fillText(`${H}°`, c, c + 0.09 * R);

    // End labels for the arcs
    ctx.fillStyle = theme.muted || theme.fg;
    ctx.font = `600 ${Math.round(0.055 * R)}px ${fontFamily}`;
    const lab = (txt, angle, r) => { const a = rad(angle); ctx.fillText(txt, c + Math.cos(a) * r * R, c + Math.sin(a) * r * R); };
    lab("C", 180 + 10, 0.97 + 0.0);
    lab("L", 180 - 10, 0.97 + 0.0);

    // Handles
    const mid = (HUE_IN + HUE_OUT) / 2, amid = (ARC_IN + ARC_OUT) / 2;
    handle(H, mid, hex);
    handle(chromaAngle(P / 1000), amid, hex);
    handle(lightAngle(L), amid, hex);
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    size = canvas.getBoundingClientRect().width;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    draw();
  }
  new ResizeObserver(resize).observe(canvas);

  // ---- Pointer interaction ----
  let active = null;
  function polar(e) {
    const r = canvas.getBoundingClientRect();
    const dx = e.clientX - r.left - r.width / 2, dy = e.clientY - r.top - r.height / 2;
    return { dx, dy, dist: Math.hypot(dx, dy) / (r.width / 2), angle: (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360 };
  }
  function pick(p) {
    if (p.dist > 1.02 || p.dist < 0.3) return null;
    if (p.dist < (HUE_OUT + ARC_IN) / 2) return "h";
    return p.dx < 0 ? "c" : "l";
  }
  function setFrom(p) {
    if (active === "h") ok.h.value = Math.round(p.angle) % 360;
    if (active === "l") {
      const t = p.angle >= L_START - SPAN && p.angle <= L_START ? (L_START - p.angle) / SPAN : (p.dy < 0 ? 1 : 0);
      ok.l.value = (t * 100).toFixed(1);
    }
    if (active === "c") {
      const t = p.angle >= C_START && p.angle <= C_START + SPAN ? (p.angle - C_START) / SPAN : (p.dy < 0 ? 1 : 0);
      ok.c.value = Math.round(t * 1000);
    }
    update();
  }
  canvas.addEventListener("pointerdown", e => {
    const p = polar(e);
    active = pick(p);
    if (!active) return;
    canvas.setPointerCapture(e.pointerId);
    ok[active].focus({ preventScroll: true });
    setFrom(p);
  });
  canvas.addEventListener("pointermove", e => { if (active) setFrom(polar(e)); });
  const end = () => { active = null; };
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);

  // ---- Readouts and page colors ----
  function update() {
    const H = +ok.h.value, C = posToChroma(+ok.c.value), L = +ok.l.value;
    const res = oklchToRgb(L / 100, C, H);
    const hex = toHex(res.rgb);
    $("o-hue-v").textContent = H + "°";
    $("o-chroma-v").textContent = C.toFixed(3);
    $("o-light-v").textContent = L.toFixed(1) + "%";
    $("o-hex").textContent = hex;
    $("o-alt").textContent = `oklch(${L.toFixed(1)}% ${res.c.toFixed(3)} ${H})`;
    $("o-gamut").hidden = !res.clipped;
    $("o-gamut").textContent = `Outside sRGB, shown at chroma ${res.c.toFixed(3)}`;
    applyPage(L / 100, res.c, H, hex);
    draw();
    store.set("ok-h", ok.h.value); store.set("ok-c", ok.c.value); store.set("ok-l", ok.l.value);
  }

  // Surfaces and borders are offset in OKLCH lightness so they track perceived brightness
  function applyPage(L, C, H, hex) {
    const s = root.style;
    const dark = L < 0.6;
    theme = {
      dark,
      fg: dark ? "#ececf1" : "#1c1d24",
      muted: dark ? "#b8bac6" : "#3f414c",
      line: hexOf(clamp(L + (dark ? 0.14 : -0.12), 0, 1), C, H)
    };
    s.setProperty("--bg", hex);
    s.setProperty("--surface", hexOf(clamp(L + (dark ? 0.05 : 0.03), 0, 1), C, H));
    s.setProperty("--line", theme.line);
    s.setProperty("--fg", theme.fg);
    s.setProperty("--muted", theme.muted);
    s.colorScheme = dark ? "dark" : "light";
  }

  // ---- Initial state ----
  const num = k => { const v = parseFloat(store.get(k)); return Number.isFinite(v) ? v : null; };
  const startDark = root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  ok.h.value = num("ok-h") ?? 270;
  ok.c.value = num("ok-c") ?? chromaToPos(0.01);
  ok.l.value = num("ok-l") ?? (startDark ? 18 : 97.5);
  update();

  Object.values(ok).forEach(el => {
    el.addEventListener("input", update);
    el.addEventListener("focus", draw);
    el.addEventListener("blur", draw);
  });
  if (document.fonts) document.fonts.ready.then(draw);
</script>
