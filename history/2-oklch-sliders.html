<title>OKLCH Background Tuner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: single narrow column; header, then one slider panel. Page colors are overwritten live by the sliders. */
  :root {
    --bg: #f6f6f8;
    --fg: #1c1d24;
    --muted: #6a6c7a;
    --line: #dcdde4;
    --surface: #ffffff;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #15161b; --fg: #ececf1; --muted: #9a9cab; --line: #2c2e38; --surface: #1d1e25; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #15161b; --fg: #ececf1; --muted: #9a9cab; --line: #2c2e38; --surface: #1d1e25; color-scheme: dark; }

  body {
    background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 48px 56px;
  }
  main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  header h1 { font-size: 1.9rem; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); max-width: 62ch; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  .panel {
    display: flex; flex-direction: column; gap: 16px; padding: 20px; min-width: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  }
  .ctl { display: grid; grid-template-columns: 6em minmax(0, 1fr) 7ch; align-items: center; gap: 12px; font-size: 0.9rem; font-weight: 600; }
  .ctl output { font-family: var(--mono); font-weight: 400; font-size: 0.85rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .ctl input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 14px; margin: 0;
    border-radius: 999px; border: 1px solid var(--line); cursor: pointer;
  }
  .ctl input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 2px solid var(--fg); }
  .ctl input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 2px solid var(--fg); }

  .readout { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-family: var(--mono); }
  .readout .hex { font-size: 1rem; color: var(--fg); user-select: all; }
  .readout .alt { font-size: 0.8rem; color: var(--muted); user-select: all; }
  .gamut { font-family: var(--sans); font-size: 0.8rem; color: var(--muted); }
  @media (max-width: 420px) {
    .ctl { grid-template-columns: minmax(0, 1fr) 7ch; }
    .ctl input[type="range"] { grid-column: 1 / -1; grid-row: 2; }
  }
</style>

<main>
  <header>
    <h1>OKLCH Background Tuner</h1>
    <p>Set the page background with OKLCH hue, chroma and lightness. Lightness matches how bright a color looks, so equal steps look equal at every hue. Chroma uses an exponential scale for finer control at low values.</p>
  </header>

  <section class="panel" aria-label="OKLCH controls">
    <label class="ctl" for="o-hue"><span>Hue</span><input type="range" id="o-hue" min="0" max="360" step="1"><output id="o-hue-v" for="o-hue"></output></label>
    <label class="ctl" for="o-chroma"><span>Chroma</span><input type="range" id="o-chroma" min="0" max="1000" step="1"><output id="o-chroma-v" for="o-chroma"></output></label>
    <label class="ctl" for="o-light"><span>Lightness</span><input type="range" id="o-light" min="0" max="100" step="0.1"><output id="o-light-v" for="o-light"></output></label>
    <div class="readout">
      <span class="hex" id="o-hex"></span>
      <span class="alt" id="o-alt"></span>
      <span class="gamut" id="o-gamut" hidden></span>
    </div>
  </section>
</main>

<script>
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };
  const $ = id => document.getElementById(id);
  const root = document.documentElement;

  // ---- Color math (sRGB channels are 0..1) ----
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const range = (a, b, step) => { const r = []; for (let v = a; v <= b + 1e-9; v += step) r.push(v); return r; };
  const toHex = rgb => "#" + rgb.map(v => Math.round(clamp(v, 0, 1) * 255).toString(16).padStart(2, "0")).join("");
  const grad = hexes => `linear-gradient(to right, ${hexes.join(", ")})`;

  const toGamma = v => v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
  // OKLCH (L 0..1) -> linear sRGB, may fall outside 0..1
  function oklchToLinear(L, C, H) {
    const hr = H * Math.PI / 180, a = C * Math.cos(hr), b = C * Math.sin(hr);
    const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
    const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
    const s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
    return [
       4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
    ];
  }
  const inGamut = rgb => rgb.every(v => v >= -1e-5 && v <= 1 + 1e-5);
  // Gamut-maps by lowering chroma (keeping lightness and hue) until the color fits sRGB
  function oklchToRgb(L, C, H) {
    let c = C;
    if (!inGamut(oklchToLinear(L, C, H))) {
      let lo = 0, hi = C;
      for (let i = 0; i < 24; i++) { const mid = (lo + hi) / 2; if (inGamut(oklchToLinear(L, mid, H))) lo = mid; else hi = mid; }
      c = lo;
    }
    return { rgb: oklchToLinear(L, c, H).map(v => toGamma(clamp(v, 0, 1))), c, clipped: c < C - 1e-4 };
  }

  // ---- Exponential chroma scale: position 0..1000, finer steps near 0 ----
  const C_MAX = 0.37;                                                      // covers every sRGB color
  const posToChroma = p => C_MAX * (Math.pow(101, p / 1000) - 1) / 100;
  const chromaToPos = c => Math.round(1000 * Math.log(clamp(c, 0, C_MAX) / C_MAX * 100 + 1) / Math.log(101));

  // ---- Controls ----
  const ok = { h: $("o-hue"), c: $("o-chroma"), l: $("o-light") };

  function update() {
    const H = +ok.h.value, C = posToChroma(+ok.c.value), L = +ok.l.value;
    const res = oklchToRgb(L / 100, C, H);
    const hex = toHex(res.rgb);
    ok.h.style.background = grad(range(0, 360, 15).map(x => toHex(oklchToRgb(L / 100, C, x).rgb)));
    ok.c.style.background = grad(range(0, 1000, 100).map(p => toHex(oklchToRgb(L / 100, posToChroma(p), H).rgb)));
    ok.l.style.background = grad(range(0, 100, 10).map(l => toHex(oklchToRgb(l / 100, C, H).rgb)));
    $("o-hue-v").textContent = H + "°";
    $("o-chroma-v").textContent = C.toFixed(3);
    $("o-light-v").textContent = L.toFixed(1) + "%";
    $("o-hex").textContent = hex;
    $("o-alt").textContent = `oklch(${L.toFixed(1)}% ${res.c.toFixed(3)} ${H})`;
    $("o-gamut").hidden = !res.clipped;
    $("o-gamut").textContent = `Outside sRGB, shown at chroma ${res.c.toFixed(3)}`;
    applyPage(L / 100, res.c, H, hex);
    store.set("ok-h", ok.h.value); store.set("ok-c", ok.c.value); store.set("ok-l", ok.l.value);
  }

  // Surfaces and borders are offset in OKLCH lightness so they track perceived brightness
  function applyPage(L, C, H, hex) {
    const s = root.style;
    const dark = L < 0.6;
    s.setProperty("--bg", hex);
    s.setProperty("--surface", toHex(oklchToRgb(clamp(L + (dark ? 0.05 : 0.03), 0, 1), C, H).rgb));
    s.setProperty("--line", toHex(oklchToRgb(clamp(L + (dark ? 0.14 : -0.12), 0, 1), C, H).rgb));
    s.setProperty("--fg", dark ? "#ececf1" : "#1c1d24");
    s.setProperty("--muted", dark ? "#b8bac6" : "#3f414c");
    s.colorScheme = dark ? "dark" : "light";
  }

  // ---- Initial state ----
  const num = k => { const v = parseFloat(store.get(k)); return Number.isFinite(v) ? v : null; };
  const startDark = root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  ok.h.value = num("ok-h") ?? 270;
  ok.c.value = num("ok-c") ?? chromaToPos(0.01);
  ok.l.value = num("ok-l") ?? (startDark ? 18 : 97.5);
  update();

  Object.values(ok).forEach(el => el.addEventListener("input", update));
</script>
